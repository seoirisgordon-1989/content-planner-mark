<style>
  html, body { margin: 0; padding: 0; background: #f6f5f2; -webkit-text-size-adjust: 100%; }
  * { box-sizing: border-box; }
  a { color: #1f5f4a; }
  a:hover { color: #113a2d; }
  input { font-family: inherit; }
  img { -webkit-user-drag: none; }
  body { min-height: 100vh; background: #f6f5f2; color: #17170f; font-family: Heebo, 'Noto Sans Hebrew', Arial, sans-serif; }

  .header { position: sticky; top: 0; z-index: 20; background: rgba(246,245,242,0.97); backdrop-filter: blur(6px); border-bottom: 1px solid #d8d4ca; padding: 14px 16px 10px; }
  .header-row { display: flex; align-items: baseline; gap: 10px; }
  .title { font-size: 19px; font-weight: 800; letter-spacing: -0.01em; }
  .subtitle { font-size: 12px; color: #7a766c; font-weight: 500; }
  .count { margin-right: auto; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #4a4740; }
  .search { width: 100%; margin-top: 10px; padding: 10px 12px; font-size: 15px; border: 1px solid #cfcbc1; border-radius: 8px; background: #fffefb; outline: none; color: #17170f; }
  .chips { display: flex; gap: 6px; overflow-x: auto; margin-top: 10px; padding-bottom: 2px; }
  .chip { flex: 0 0 auto; padding: 6px 12px; font-size: 13px; font-family: inherit; font-weight: 500; border: 1px solid #cfcbc1; border-radius: 999px; background: transparent; color: #4a4740; cursor: pointer; white-space: nowrap; }
  .chip.active { font-weight: 700; border-color: #17170f; background: #17170f; color: #f6f5f2; }

  .main { padding: 4px 16px 60px; max-width: 1200px; margin: 0 auto; }
  .group { margin-top: 22px; }
  .group-head { display: flex; align-items: baseline; gap: 8px; padding-bottom: 6px; border-bottom: 2px solid #17170f; }
  .group-head h2 { margin: 0; font-size: 15px; font-weight: 800; letter-spacing: 0.02em; }
  .group-count { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #7a766c; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 10px; margin-top: 12px; }
  .card { background: #fffefb; border: 1px solid #e2ded4; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .card-img-wrap { background: #fff; border-bottom: 1px solid #eeebe3; }
  .card-img-wrap img { display: block; width: 100%; aspect-ratio: 154 / 166; object-fit: contain; }
  .card-body { padding: 8px 9px 9px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
  .card-name { font-size: 13.5px; font-weight: 500; line-height: 1.3; flex: 1; }
  .card-price { display: flex; align-items: baseline; gap: 3px; }
  .price-num { font-family: 'IBM Plex Mono', monospace; font-size: 19px; font-weight: 600; letter-spacing: -0.02em; }
  .price-sym { font-size: 12px; color: #7a766c; }
  .empty { padding: 60px 0; text-align: center; color: #7a766c; font-size: 14px; }
  .footnote { margin-top: 36px; padding-top: 12px; border-top: 1px solid #d8d4ca; font-size: 12px; color: #7a766c; line-height: 1.6; }
</style>

<body>

  <div class="main">
    <div id="groups"></div>
    <div class="empty" id="empty" style="display:none">לא נמצאו תוצאות</div>
    <div class="footnote">שמות, מחירים ותמונות מתוך הקטלוג המקורי. <span id="total"></span> פריטים.</div>

let state = { q: "", cat: "הכל" };

function imgSrc(n) {
  const id = String(n).padStart(3, "0");
  const map = window.CATALOG_IMAGES;
  return (map && map[id]) || "img/" + id + ".jpg";
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

function render() {
  const q = state.q.trim();
  const cat = state.cat;

  const groupsEl = document.getElementById('groups');
  const chipsEl = document.getElementById('chips');
  const emptyEl = document.getElementById('empty');

  const chipCats = ["הכל"].concat(order);
  chipsEl.innerHTML = chipCats.map((c) => {
    const active = cat === c;
    const label = c === "הכל" ? "הכל · " + items.length : c;
    return `<button class="chip${active ? ' active' : ''}" data-cat="${escapeHtml(c)}">${escapeHtml(label)}</button>`;
  }).join('');

  let shown = 0;
  let html = '';
  order.forEach((name) => {
    if (cat !== "הכל" && cat !== name) return;
    const rows = items.filter((it) => it[0] === name && (!q || it[1].includes(q)));
    if (!rows.length) return;
    shown += rows.length;
    html += `<section class="group">
      <div class="group-head"><h2>${escapeHtml(name)}</h2><span class="group-count">${rows.length}</span></div>
      <div class="grid">
        ${rows.map((it) => `
          <div class="card">
            <div class="card-img-wrap"><img src="${imgSrc(it[3])}" alt="${escapeHtml(it[1])}" loading="lazy" /></div>
            <div class="card-body">
              <div class="card-name">${escapeHtml(it[1])}</div>
              <div class="card-price"><span class="price-num">${it[2]}</span><span class="price-sym">₪</span></div>
            </div>
          </div>`).join('')}
      </div>
    </section>`;
  });

  groupsEl.innerHTML = html;
  emptyEl.style.display = shown === 0 ? '' : 'none';
  document.getElementById('count').textContent = shown + '/' + items.length;
  document.getElementById('total').textContent = items.length;

  chipsEl.querySelectorAll('.chip').forEach((btn) => {
    btn.addEventListener('click', () => {
      state.cat = btn.dataset.cat;
      render();
    });
  });
}

document.getElementById('search').addEventListener('input', (e) => {
  state.q = e.target.value;
  render();
});

render();
</script>
