<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>גלריית אלכוהול</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
<script src="galleryimages.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #f6f5f2; -webkit-text-size-adjust: 100%; }
  * { box-sizing: border-box; }
  body { min-height: 100vh; background: #f6f5f2; color: #17170f; font-family: Heebo, 'Noto Sans Hebrew', Arial, sans-serif; }
  img { -webkit-user-drag: none; }

  .header { position: sticky; top: 0; z-index: 20; background: rgba(246,245,242,0.97); backdrop-filter: blur(6px); border-bottom: 1px solid #d8d4ca; padding: 14px 16px 10px; }
  .header-row { display: flex; align-items: baseline; gap: 10px; }
  .title { font-size: 19px; font-weight: 800; letter-spacing: -0.01em; }
  .count { margin-right: auto; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #4a4740; }
  .chips { display: flex; gap: 6px; overflow-x: auto; margin-top: 10px; padding-bottom: 2px; }
  .chip { flex: 0 0 auto; padding: 6px 12px; font-size: 13px; font-family: inherit; font-weight: 500; border: 1px solid #cfcbc1; border-radius: 999px; background: transparent; color: #4a4740; cursor: pointer; white-space: nowrap; }
  .chip.active { font-weight: 700; border-color: #17170f; background: #17170f; color: #f6f5f2; }

  .main { padding: 12px 16px 60px; max-width: 1200px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 10px; }
  .card { background: #fffefb; border: 1px solid #e2ded4; border-radius: 10px; overflow: hidden; }
  .card img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: contain; background: #fff; }
  .empty { padding: 60px 0; text-align: center; color: #7a766c; font-size: 14px; }
</style>
</head>
<body>
  <div class="header">
    <div class="header-row">
      <div class="title">גלריית אלכוהול</div>
      <div class="count" id="count"></div>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <div class="main">
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">לא נמצאו תמונות</div>
  </div>

<script>
const items = [
  ["ליקרים ומרים", 1],
  ["ליקרים ומרים", 2],
  ["טקילה", 3],
  ["ליקרים ומרים", 4],
  ["קוקטיילים", 5],
  ["בירה", 6],
  ["רום", 7],
  ["משקאות אנרגיה", 8],
  ["וויסקי", 9],
  ["וויסקי", 10],
  ["וויסקי", 11],
  ["בירה", 12],
  ["משקאות אנרגיה", 13],
  ["ערק", 14],
  ["משקאות אנרגיה", 15],
  ["ליקרים ומרים", 16],
  ["בירה", 17],
  ["וויסקי", 18],
  ["וויסקי", 19],
  ["בירה", 20],
  ["בירה", 21],
  ["וודקה", 22],
  ["ליקרים ומרים", 23],
  ["וויסקי", 24],
  ["בירה", 25],
  ["משקאות אנרגיה", 26],
  ["בירה", 27],
  ["טקילה", 28],
  ["וודקה", 29],
  ["וויסקי", 30],
  ["וודקה", 31],
  ["וויסקי", 32],
  ["וודקה", 33],
  ["טקילה", 34],
  ["וויסקי", 35],
  ["וודקה", 36],
  ["וויסקי", 37],
  ["בירה", 38],
  ["ג'ין", 39],
  ["וודקה", 40],
  ["וודקה", 41],
  ["בירה", 42],
  ["בירה", 43],
  ["וודקה", 44],
  ["ג'ין", 45],
  ["וודקה", 46],
  ["קוקטיילים", 47],
  ["בירה", 48],
  ["וודקה", 49],
  ["וודקה", 50],
  ["וויסקי", 51],
  ["וודקה", 52],
  ["בירה", 53],
  ["וויסקי", 54],
  ["ליקרים ומרים", 55],
  ["בירה", 56],
  ["וויסקי", 57],
  ["בירה", 58],
  ["בירה", 59],
  ["וודקה", 60],
  ["וויסקי", 61],
  ["וויסקי", 62],
  ["בירה", 63],
  ["משקאות אנרגיה", 64],
  ["וויסקי", 65],];

const order = ['וודקה', 'וויסקי', "ג'ין", 'רום', 'טקילה', 'ליקרים ומרים', 'ערק', 'בירה', 'קוקטיילים', 'משקאות אנרגיה'];

let state = { cat: "הכל" };

function imgSrc(n) {
  const id = String(n).padStart(3, "0");
  const map = window.GALLERY_IMAGES;
  return (map && map[id]) || "";
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

function render() {
  const cat = state.cat;
  const chipsEl = document.getElementById('chips');
  const gridEl = document.getElementById('grid');
  const emptyEl = document.getElementById('empty');

  const presentCats = order.filter((c) => items.some((it) => it[0] === c));
  const chipCats = ["הכל"].concat(presentCats);
  chipsEl.innerHTML = chipCats.map((c) => {
    const active = cat === c;
    const label = c === "הכל" ? "הכל · " + items.length : c;
    return `<button type="button" class="chip${active ? ' active' : ''}" data-cat="${escapeHtml(c)}">${escapeHtml(label)}</button>`;
  }).join('');

  const rows = items.filter((it) => cat === "הכל" || it[0] === cat);

  gridEl.innerHTML = rows.map((it) => `<div class="card"><img src="${imgSrc(it[1])}" alt="${escapeHtml(it[0])}" loading="lazy" /></div>`).join('');
  emptyEl.style.display = rows.length === 0 ? '' : 'none';
  document.getElementById('count').textContent = rows.length + '/' + items.length;

  chipsEl.querySelectorAll('.chip').forEach((btn) => {
    btn.addEventListener('click', () => {
      state.cat = btn.dataset.cat;
      render();
    });
  });
}

render();
</script>
</body>
</html>
